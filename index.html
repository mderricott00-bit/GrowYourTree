<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Your Tree</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="logo-container">
        <img src="trees/Logo.png" alt="GrowYourTree Logo" class="logo">
    </header>

<main class="app-content">
    <p class="tree-counter" id="tree-counter">Trees Grown: <span id="trees-grown">0</span></p>
    <p class="sr-only" id="app-status" role="status" aria-live="polite" aria-atomic="true"></p>

    <form class="growth-form" id="growth-form">
        <fieldset class="checkbox-group">
            <legend class="group-legend">Which actions did you complete today?</legend>
            <div></div>
            <label><input type="checkbox" id="action-recycled"> Recycled</label>
            <label><input type="checkbox" id="action-composted"> Composted</label>

            <div class="input-item">
                <label><input type="checkbox" id="action-reusable" aria-describedby="reusable-hint"> Made a product reusable</label>
                <span class="hint-text" id="reusable-hint">Example: using old jars for storage</span>
            </div>

            <label><input type="checkbox" id="action-used-reusable"> Used reusable product</label>
            <label><input type="checkbox" id="action-reduced-waste"> Reduced waste</label>
        </fieldset>

        <button type="submit" class="grow-btn" id="grow-btn">Grow</button>
    </form>
<div></div>
    <section class="video-section" aria-labelledby="stage-text">
        <p class="stage-text" id="stage-text">Current stage: Sprout</p>
        <img id="tree-img" src="trees/Sprout.jpg" alt="Sprout stage tree">
        <video id="tree-video" src="" aria-hidden="true" muted playsinline preload="metadata"></video>
    </section>

    <section class="progress-section" aria-labelledby="progress-heading">
        <h2 class="sr-only" id="progress-heading">Tree growth progress</h2>
        <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="Tree growth progress" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" aria-valuetext="Sprout stage, 0 of 20 points">
            <div class="progress-segment"><div class="progress-fill" id="prog-0"></div></div>
            <div class="progress-segment"><div class="progress-fill" id="prog-1"></div></div>
            <div class="progress-segment"><div class="progress-fill" id="prog-2"></div></div>
            <div class="progress-segment"><div class="progress-fill" id="prog-3"></div></div>
        </div>
        <div class="progress-labels">
            <span>Seedling</span>
            <span>Sapling</span>
            <span>Adult</span>
            <span>Complete</span>
        </div>
    </section>

    <section class="forest-section" id="forest-section" hidden>
        <h2 class="forest-title">Your Forest</h2>
        <div class="forest" id="forest"></div>
    </section>
</main>

<script>
    const stages = [
        { minPts: 0, video: null, image: 'trees/Sprout.jpg', label: 'Sprout' },
        { minPts: 5, video: 'trees/SproutToSeedling.mp4', image: 'trees/Seedling.jpg', label: 'Seedling' },
        { minPts: 10, video: 'trees/SeedlingToSapling.mp4', image: 'trees/Sapling.jpg', label: 'Sapling' },
        { minPts: 15, video: 'trees/SaplingToAdult.mp4', image: 'trees/AdultTree.jpg', label: 'Adult' },
        { minPts: 20, video: 'trees/AdultToSprout.mp4', image: 'trees/Sprout.jpg', label: 'Complete' }
    ];

    function getStage(pts) {
        let stage = stages[0];
        for (const s of stages) {
            if (pts >= s.minPts) stage = s;
        }
        return stage;
    }

    // Check if user prefers reduced motion
    function prefersReducedMotion() {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    const img   = document.getElementById('tree-img');
    const video = document.getElementById('tree-video');
    const stageText = document.getElementById('stage-text');
    const progressBar = document.getElementById('progress-bar');
    const statusMessage = document.getElementById('app-status');
    const growthForm = document.getElementById('growth-form');

    function announceStatus(message) {
        statusMessage.textContent = message;
    }

    function setStageText(label) {
        stageText.textContent = 'Current stage: ' + label;
    }

    function showImage(stage) {
        video.pause();
        video.currentTime = 0;
        video.hidden = true;
        video.style.display = 'none';
        img.src = stage.image;
        img.alt = stage.label + ' stage tree';
        setStageText(stage.label);
        img.hidden = false;
        img.style.display = 'block';
    }

    function updateProgress(pts) {
        const clamped = Math.max(0, Math.min(20, pts));
        for (let i = 0; i < 4; i++) {
            const fill = Math.max(0, Math.min(1, (pts - i * 5) / 5));
            document.getElementById('prog-' + i).style.width = (fill * 100) + '%';
        }
        const currentStage = getStage(clamped);
        progressBar.setAttribute('aria-valuenow', String(clamped));
        progressBar.setAttribute('aria-valuetext', currentStage.label + ' stage, ' + clamped + ' of 20 points');
    }

    function updateTreeCounter() {
        const count = localStorage.getItem('treesGrown') || '0';
        document.getElementById('trees-grown').textContent = count;
        document.getElementById('tree-counter').setAttribute('aria-label', 'Trees grown: ' + count);
    }

    // Seeded pseudo-random number generator (mulberry32)
    function seededRandom(seed) {
        return function () {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function renderForest() {
        const count = parseInt(localStorage.getItem('treesGrown') || '0', 10);
        const section = document.getElementById('forest-section');
        const container = document.getElementById('forest');
        container.innerHTML = '';

        if (count === 0) {
            section.hidden = true;
            return;
        }
        section.hidden = false;

        for (let i = 0; i < count; i++) {
            const rand = seededRandom(i * 9973 + 42);
            const size = 45 + rand() * 30;            // 45–75px
            const left = (i / Math.max(count, 1)) * 85 + rand() * 10; // spread across width
            const bottom = rand() * 30 + (55 - size) * 0.8; // smaller trees higher up

            const tree = document.createElement('img');
            tree.src = 'trees/AdultTree.jpg';
            tree.className = 'forest-tree';
            tree.alt = '';
            tree.setAttribute('aria-hidden', 'true');
            tree.style.width = size + 'px';
            tree.style.left = left + '%';
            tree.style.bottom = bottom + 'px';
            tree.style.zIndex = Math.round(size); // bigger trees in front
            container.appendChild(tree);
        }
    }

    function completeTreeGrowth() {
        const grown = parseInt(localStorage.getItem('treesGrown') || '0', 10) + 1;
        localStorage.setItem('treesGrown', String(grown));
        localStorage.setItem('treePoints', '0');
        updateProgress(0);
        updateTreeCounter();
        renderForest();
        showImage(getStage(0));
        announceStatus('Tree completed. Your forest now has ' + grown + ' trees.');
    }

    // Restore saved state on load
    const savedPts = parseInt(localStorage.getItem('treePoints') || '0', 10);
    showImage(getStage(savedPts));
    updateProgress(savedPts);
    updateTreeCounter();
    renderForest();

    video.addEventListener('ended', function () {
        const pts = parseInt(localStorage.getItem('treePoints') || '0', 10);
        if (pts >= 20) {
            completeTreeGrowth();
            return;
        }
        const currentStage = getStage(pts);
        showImage(currentStage);
        announceStatus(currentStage.label + ' stage reached. ' + pts + ' of 20 points.');
    });

    growthForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const checkboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"]');
        let earned = 0;
        checkboxes.forEach(cb => { if (cb.checked) earned++; });

        if (earned === 0) {
            announceStatus('Select at least one eco action before growing your tree.');
            return;
        }

        checkboxes.forEach(cb => { cb.checked = false; });

        const prev = parseInt(localStorage.getItem('treePoints') || '0', 10);
        const total = prev + earned;
        localStorage.setItem('treePoints', String(total));
        updateProgress(total);

        const prevStage = getStage(prev);
        const stage = getStage(total);
        if (stage.video && stage.minPts !== prevStage.minPts && !prefersReducedMotion()) {
            img.hidden = true;
            img.style.display = 'none';
            video.src = stage.video;
            video.hidden = false;
            video.style.display = 'block';
            video.load();
            setStageText(stage.label);
            announceStatus(earned + ' actions added. ' + stage.label + ' stage reached.');
            video.play().catch(function () {
                if (total >= 20) {
                    completeTreeGrowth();
                    return;
                }
                showImage(stage);
                announceStatus(earned + ' actions added. ' + stage.label + ' stage reached. ' + total + ' of 20 points.');
            });
        } else {
            if (total >= 20) {
                completeTreeGrowth();
                return;
            }
            showImage(stage);
            announceStatus(earned + ' actions added. ' + stage.label + ' stage reached. ' + total + ' of 20 points.');
        }
    });
</script>

</body>
</html>
